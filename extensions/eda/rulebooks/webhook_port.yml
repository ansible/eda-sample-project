---
- name: Run a webhook listener service
  hosts: all
  sources:
    - ansible.eda.webhook:
        port: 5000
  rules:
    - name: Webhook event echo payload
      condition: event.payload.ping == "pong" and event.payload.echo_mode == "payload"
      action:
        debug:
          msg: "{{ event.payload }}"

    - name: Webhook event
      condition: event.payload.ping == "pong"
      action:
        debug:
          msg: "Webhook triggered!"

    - name: Emit activation log completion marker
      condition: >-
        event.payload.debug_marker is defined and
        event.payload.completion_marker is defined
      action:
        print_event:
          pretty: false

    - name: Shutdown
      condition: event.payload.shutdown is defined
      action:
        shutdown:
